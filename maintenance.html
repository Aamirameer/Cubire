<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubire | Under Maintenance</title>
<style>
  :root {
    --cyan: #1fb6e8;
    --blue: #0a6fb8;
    --deep: #0b1d33;
    --bg1: #eef3f8;
    --bg2: #c9d6e3;
    --text: #12263a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    padding: 24px;
  }
  /* soft diagonal light beams like the logo backdrop */
  body::before, body::after {
    content: "";
    position: fixed;
    top: -20%;
    width: 22%;
    height: 150%;
    background: rgba(255,255,255,0.35);
    transform: rotate(25deg);
    z-index: 0;
  }
  body::before { left: 55%; }
  body::after { left: 78%; width: 10%; background: rgba(255,255,255,0.22); }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
    text-align: center;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 24px;
    padding: 48px 36px;
    box-shadow: 0 25px 60px rgba(11,29,51,0.18);
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .logo svg { width: 76px; height: 76px; }
  .logo span {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--deep);
  }

  .gear-wrap { margin: 6px auto 18px; width: 90px; height: 90px; }
  .gear { width: 100%; height: 100%; animation: spin 8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin-bottom: 14px;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.lead {
    font-size: 1.05rem;
    line-height: 1.7;
    color: #3b5169;
    max-width: 520px;
    margin: 0 auto 28px;
  }

  .progress {
    max-width: 420px;
    margin: 0 auto 30px;
    height: 10px;
    background: rgba(11,29,51,0.1);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress div {
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    animation: load 2.6s ease-in-out infinite alternate;
  }
  @keyframes load { from { width: 25%; } to { width: 85%; } }

  .contact {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  .btn {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: transform .2s, box-shadow .2s;
  }
  .btn.primary {
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    color: #fff;
    box-shadow: 0 8px 20px rgba(10,111,184,0.35);
  }
  .btn.ghost {
    border: 2px solid var(--blue);
    color: var(--blue);
  }
  .btn:hover { transform: translateY(-2px); }

  footer {
    margin-top: 32px;
    font-size: 0.82rem;
    color: #6a7f94;
  }

  @media (max-width: 480px) {
    .card { padding: 36px 20px; }
    .logo span { font-size: 1.6rem; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#35d0f5"/>
            <stop offset="1" stop-color="#0a6fb8"/>
          </linearGradient>
        </defs>
        <path d="M80 28 A38 38 0 1 0 80 72" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="butt"/>
        <path d="M66 36 A22 22 0 1 0 66 64" fill="none" stroke="#0a6fb8" stroke-width="9"/>
      </svg>
      <span>CUBIRE</span>
    </div>

    <div class="gear-wrap">
      <svg class="gear" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke="#1fb6e8" stroke-width="6" stroke-linecap="round">
          <circle cx="50" cy="50" r="18"/>
          <path d="M50 8v14M50 78v14M8 50h14M78 50h14M20 20l10 10M70 70l10 10M80 20L70 30M30 70L20 80"/>
        </g>
      </svg>
    </div>

    <h1>We’ll Be Back Soon</h1>
    <p class="lead">
      Our website is currently undergoing scheduled maintenance to give you a better experience.
      Thank you for your patience — we’ll be back online shortly.
    </p>

    <div class="progress"><div></div></div>

    <div class="contact">
      <a class="btn primary" href="mailto:info@cubire.com">Email Us</a>
      <a class="btn ghost" href="tel:+920000000000">Call Support</a>
    </div>

    <footer>&copy; <span id="y"></span> Cubire. All rights reserved.</footer>
  </main>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
